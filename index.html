<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming JSON Parser Demo</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "zod": "https://esm.sh/zod@3.24" } }
</script>
</head>
<body>

<header>
  <h1>Streaming JSON Parser</h1>
  <span class="status" id="status">idle</span>
  <button class="btn-orange" id="stepBtn" disabled>Step</button>
  <button class="btn-yellow" id="pauseBtn" disabled>Pause</button>
  <button class="btn-accent" id="startBtn">Start Stream</button>
</header>

<main>
  <div class="panel">
    <div class="panel-header">Raw input received</div>
    <div class="panel-body" id="rawBody">
      <span class="empty-state">Click "Start Stream" to begin</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">Zod Schema</div>
    <div class="panel-body" id="schemaBody">
      <span class="empty-state">Full schema will appear here</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">Parsed object (live)</div>
    <div class="panel-body" id="parsedBody">
      <span class="empty-state">Waiting for data...</span>
    </div>
  </div>

  <div class="panel algo-panel">
    <div class="panel-header">Algorithm state</div>
    <div class="panel-body">
      <div class="algo-grid">
        <span class="algo-label">Stack</span>
        <span class="algo-value" id="algoStack"></span>
        <span class="algo-label">In string?</span>
        <span class="algo-value" id="algoInString"></span>
        <span class="algo-label">Steps</span>
        <span class="algo-value" id="algoSteps"></span>
        <span class="algo-label">Auto-closed</span>
        <div class="completed-json" id="algoCompleted"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <a href="https://github.com/infomiho/json-parse" target="_blank" rel="noopener">github.com/infomiho/json-parse</a>
</footer>

<script type="module">
import { jsonReaderDebug } from "./json-reader.js";
import { z } from "zod";

const ResponseSchema = z.object({
	id: z.string(),
	object: z.string(),
	model: z.string(),
	choices: z.array(
		z.object({
			index: z.number(),
			message: z.object({
				role: z.string(),
				content: z.string(),
				tool_calls: z.array(
					z.object({
						id: z.string(),
						type: z.string(),
						function: z.object({
							name: z.string(),
							arguments: z.string(),
						}),
					}),
				),
			}),
			finish_reason: z.string(),
		}),
	),
	usage: z.object({
		prompt_tokens: z.number(),
		completion_tokens: z.number(),
		total_tokens: z.number(),
	}),
});

const SAMPLE = JSON.stringify(
	{
		id: "chatcmpl-9a1b2c3d",
		object: "chat.completion.chunk",
		model: "gpt-4o",
		choices: [
			{
				index: 0,
				message: {
					role: "assistant",
					content: "Here is a quick summary of the data you requested.",
					tool_calls: [
						{
							id: "call_abc123",
							type: "function",
							function: {
								name: "get_weather",
								arguments: '{"location":"San Francisco","units":"celsius"}',
							},
						},
					],
				},
				finish_reason: "tool_calls",
			},
		],
		usage: { prompt_tokens: 42, completion_tokens: 128, total_tokens: 170 },
	},
	null,
	2,
);

const el = (id) => document.getElementById(id);

const startBtn = el("startBtn");
const pauseBtn = el("pauseBtn");
const stepBtn = el("stepBtn");
const statusEl = el("status");
const rawBody = el("rawBody");
const schemaBody = el("schemaBody");
const parsedBody = el("parsedBody");
const algoStack = el("algoStack");
const algoInString = el("algoInString");
const algoSteps = el("algoSteps");
const algoCompleted = el("algoCompleted");

let paused = false;
let stepOnce = false;
let pauseResolve = null;

function setPaused(value) {
	paused = value;
	pauseBtn.textContent = paused ? "Resume" : "Pause";
	pauseBtn.classList.toggle("is-paused", paused);
	stepBtn.disabled = !paused;
	statusEl.textContent = paused ? "paused" : "streaming...";
	statusEl.className = `status ${paused ? "paused" : "active"}`;
}

function resume() {
	if (!pauseResolve) return;
	const r = pauseResolve;
	pauseResolve = null;
	r();
}

function waitIfPaused() {
	if (!paused) return Promise.resolve();
	return new Promise((resolve) => {
		pauseResolve = resolve;
	});
}

pauseBtn.addEventListener("click", () => {
	setPaused(!paused);
	if (!paused) resume();
});

stepBtn.addEventListener("click", () => {
	stepOnce = true;
	resume();
});

const CHUNK_SIZE = 3;
const CHUNK_DELAY = 30;

function createChunkedStream(text) {
	let offset = 0;
	return new ReadableStream({
		async pull(controller) {
			if (offset >= text.length) {
				controller.close();
				return;
			}
			const slice = text.slice(offset, offset + CHUNK_SIZE);
			offset += CHUNK_SIZE;
			controller.enqueue(new TextEncoder().encode(slice));
			await new Promise((r) => setTimeout(r, CHUNK_DELAY));
		},
	});
}

startBtn.addEventListener("click", run);

async function run() {
	startBtn.disabled = true;
	pauseBtn.disabled = false;
	stepOnce = false;
	setPaused(false);

	rawBody.innerHTML = "";
	schemaBody.innerHTML = renderSchema(ResponseSchema, undefined);
	parsedBody.innerHTML = "";
	renderAlgo(null);

	const reader = createChunkedStream(SAMPLE).getReader();

	for await (const frame of jsonReaderDebug(reader)) {
		await waitIfPaused();

		renderRaw(frame);
		renderAlgo(frame);
		renderParsed(frame.parsed);
		schemaBody.innerHTML = renderSchema(ResponseSchema, frame.parsed);

		if (stepOnce) {
			stepOnce = false;
			setPaused(true);
		}
	}

	statusEl.textContent = "done";
	statusEl.className = "status";
	pauseBtn.disabled = true;
	stepBtn.disabled = true;
	startBtn.disabled = false;
}

function renderRaw({ raw, chunk }) {
	const prev = raw.slice(0, raw.length - chunk.length);
	rawBody.innerHTML =
		`<span class="raw-received">${esc(prev)}</span>` +
		`<span class="raw-chunk">${esc(chunk)}</span>` +
		`<span class="raw-cursor"></span>`;
	rawBody.scrollTop = rawBody.scrollHeight;
}

function renderAlgo(frame) {
	if (!frame) {
		algoStack.innerHTML = empty("empty");
		algoInString.innerHTML = '<span class="flag-off">no</span>';
		algoSteps.innerHTML = empty("none");
		algoCompleted.innerHTML = empty("...");
		return;
	}

	algoStack.innerHTML =
		frame.stack.length === 0
			? empty("empty")
			: frame.stack
					.map((s) => {
						const kind = s === "{" ? "obj" : "arr";
						return `<span class="stack-item ${kind}">${s} ${kind}</span>`;
					})
					.join("");

	let inStringHtml = frame.inString
		? '<span class="flag-on">YES &mdash; string is open</span>'
		: '<span class="flag-off">no</span>';
	if (frame.partialKey) {
		inStringHtml += '<span class="key-suppressed">KEY SUPPRESSED</span>';
	}
	algoInString.innerHTML = inStringHtml;

	algoSteps.innerHTML =
		frame.steps.length === 0
			? empty("none needed")
			: "<ul class='step-list'>" +
				frame.steps
					.map(
						(s) =>
							`<li><span class="step-label">${esc(s.label)}</span>` +
							` <span class="step-appended">${esc(s.appended)}</span></li>`,
					)
					.join("") +
				"</ul>";

	algoCompleted.textContent = frame.completed;
}

function renderParsed(obj) {
	parsedBody.innerHTML = highlightJson(JSON.stringify(obj, null, 2));
}

const ZOD_LABELS = {
	ZodString: "string",
	ZodNumber: "number",
	ZodBoolean: "boolean",
	ZodNull: "null",
	ZodAny: "any",
};

function zodTag(typeName) {
	const label = ZOD_LABELS[typeName] ?? "unknown";
	return `<span class="zod-method">z</span>.<span class="zod-type">${label}</span>()`;
}

function fieldStatus(schema, value) {
	if (value === undefined) return "shape-dim";
	return schema.safeParse(value).success ? "shape-present" : "shape-partial";
}

function asObject(value) {
	return value !== null && typeof value === "object" && !Array.isArray(value)
		? value
		: undefined;
}

function renderSchema(schema, partial) {
	const lines = [];
	walkZod(schema, partial, "", lines, true);
	return lines.join("\n");
}

function walkZod(schema, partial, indent, lines, isLast) {
	const comma = isLast ? "" : ",";
	const typeName = schema._def.typeName;

	if (typeName === "ZodObject") {
		const shape = schema.shape;
		const keys = Object.keys(shape);
		const obj = asObject(partial);
		const cls = obj !== undefined ? "shape-present" : "shape-dim";

		lines.push(
			`<span class="${cls}">${indent}<span class="zod-method">z</span>.<span class="zod-type">object</span>(<span class="zod-bracket">{</span></span>`,
		);

		keys.forEach((key, i) => {
			const child = shape[key];
			const isLastKey = i === keys.length - 1;
			const keyComma = isLastKey ? "" : ",";
			const hasKey = obj !== undefined && key in obj;
			const childVal = hasKey ? obj[key] : undefined;
			const childType = child._def.typeName;

			if (childType === "ZodObject" || childType === "ZodArray") {
				const keyCls = hasKey ? "shape-present" : "shape-dim";
				lines.push(
					`<span class="${keyCls}">${indent}  <span class="zod-key">${esc(key)}</span>:</span>`,
				);
				const sub = [];
				walkZod(child, childVal, indent + "  ", sub, true);
				if (!isLastKey && sub.length > 0) {
					sub[sub.length - 1] = sub[sub.length - 1].replace(
						/<\/span>$/,
						keyComma + "</span>",
					);
				}
				lines.push(...sub);
			} else {
				const valCls = hasKey ? fieldStatus(child, childVal) : "shape-dim";
				lines.push(
					`<span class="${valCls}">${indent}  <span class="zod-key">${esc(key)}</span>: ${zodTag(childType)}${keyComma}</span>`,
				);
			}
		});

		lines.push(
			`<span class="${cls}">${indent}<span class="zod-bracket">}</span>)${comma}</span>`,
		);
		return;
	}

	if (typeName === "ZodArray") {
		const elemSchema = schema._def.type;
		const arr = Array.isArray(partial) ? partial : undefined;
		const cls = arr !== undefined ? "shape-present" : "shape-dim";
		const elemPartial = arr?.[0];

		lines.push(
			`<span class="${cls}">${indent}<span class="zod-method">z</span>.<span class="zod-type">array</span>(</span>`,
		);
		walkZod(elemSchema, elemPartial, indent + "  ", lines, true);
		lines.push(`<span class="${cls}">${indent})${comma}</span>`);
		return;
	}

	const cls = fieldStatus(schema, partial);
	lines.push(
		`<span class="${cls}">${indent}${zodTag(typeName)}${comma}</span>`,
	);
}

function esc(str) {
	return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function empty(text) {
	return `<span class="empty-state">${text}</span>`;
}

function highlightJson(json) {
	return json
		.replace(/("(?:\\.|[^"\\])*")\s*:/g, '<span class="json-key">$1</span>:')
		.replace(
			/:\s*("(?:\\.|[^"\\])*")/g,
			': <span class="json-string">$1</span>',
		)
		.replace(/:\s*(\d+(?:\.\d+)?)/g, ': <span class="json-number">$1</span>')
		.replace(/:\s*(true|false)/g, ': <span class="json-bool">$1</span>')
		.replace(/:\s*(null)/g, ': <span class="json-null">$1</span>')
		.replace(/([[\]{}])/g, '<span class="json-bracket">$1</span>');
}
</script>

</body>
</html>
